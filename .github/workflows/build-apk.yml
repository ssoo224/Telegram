name: Build APK

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'إجبار كل المستخدمين على التحديث'
        type: boolean
        default: true
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          pip install pillow numpy
          python3 scripts/make-icons.py
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Patch Android project
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 app/scripts/patch-android.py

      - name: Signing key
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then echo "::error::ضيف سر (Secret) اسمه KEYSTORE_PASS بإعدادات المستودع"; exit 1; fi
          mkdir -p app/signing
          if [ -f app/signing/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEYSTORE_PASS -in app/signing/release.jks.enc -out "$RUNNER_TEMP/release.jks"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias babylon -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Babylon Chat, O=Babylon, C=IQ"
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEYSTORE_PASS -in "$RUNNER_TEMP/release.jks" -out app/signing/release.jks.enc
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add app/signing/release.jks.enc
            git commit -m "Add encrypted signing key"
            git push
          fi

      - name: Build release APK
        working-directory: app/android
        env:
          KS_FILE: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          APK=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" babylon-chat.apk
          ls -la babylon-chat.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Babylon Chat 1.0.${{ github.run_number }}
          files: babylon-chat.apk

      - name: Update version.json (forced update)
        env:
          BUILD: ${{ github.run_number }}
          FORCE: ${{ github.event_name != 'workflow_dispatch' || inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os
          b = int(os.environ["BUILD"])
          force = os.environ.get("FORCE", "true") == "true"
          try:
              v = json.load(open("version.json", encoding="utf-8"))
          except Exception:
              v = {}
          v["latest"] = max(b, int(v.get("latest") or 0))
          if force:
              v["minVersion"] = max(b, int(v.get("minVersion") or 0))
          v.setdefault("minVersion", 1)
          u = str(v.get("url") or "")
          if not u or "github.com" in u:
              v["url"] = "/api/apk"
          v.setdefault("notes", "يوجد تحديث جديد، حدّث التطبيق للمتابعة.")
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(v, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json
          if git diff --cached --quiet; then echo "version.json unchanged"; exit 0; fi
          git commit -m "Release v1.0.${BUILD}: version.json"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "::error::ما قدرت أحدّث version.json"
          exit 1
