<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ Chat - Telegram Web</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="app-container">

  <!-- صفحة الدخول والتسجيل -->
  <section id="authPage" class="auth-page">
    <div class="tg-logo-animated">✈</div>
    <h1 class="auth-title">AJ Chat</h1>
    <p class="auth-subtitle">تطبيق المحادثات الفوري المطور</p>

    <div class="tg-tabs">
      <button id="tabLogin" class="tg-tab active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button id="tabRegister" class="tg-tab" onclick="switchTab('register')">إنشاء حساب</button>
    </div>

    <!-- نموذج الدخول -->
    <div id="formLogin" style="width:100%;">
      <div class="tg-input-group">
        <label>البريد الإلكتروني</label>
        <input id="loginEmail" class="tg-input" type="email" placeholder="example@domain.com">
      </div>
      <div class="tg-input-group">
        <label>كلمة المرور</label>
        <input id="loginPassword" class="tg-input" type="password" placeholder="••••••••">
      </div>
      <button class="tg-btn" onclick="loginUser()">تسجيل الدخول</button>
    </div>

    <!-- نموذج التسجيل -->
    <div id="formRegister" class="hidden" style="width:100%;">
      <div class="tg-input-group">
        <label>اسم العرض (الاسم الكامل)</label>
        <input id="regName" class="tg-input" type="text" placeholder="علي الدليمي">
      </div>
      <div class="tg-input-group">
        <label>اسم المستخدم (اليوزر)</label>
        <input id="regUsername" class="tg-input" type="text" placeholder="ali_deli">
      </div>
      <div class="tg-input-group">
        <label>البريد الإلكتروني</label>
        <input id="regEmail" class="tg-input" type="email" placeholder="example@domain.com">
      </div>
      <div class="tg-input-group">
        <label>كلمة المرور</label>
        <input id="regPassword" class="tg-input" type="password" placeholder="6 أحرف على الأقل">
      </div>
      <button class="tg-btn" onclick="registerUser()">إنشاء حساب جديد</button>
    </div>
  </section>

  <!-- الصفحة الرئيسية والتطبيق -->
  <section id="mainPage" class="hidden" style="height:100%; display:flex; flex-direction:column;">
    <header class="tg-header">
      <button class="icon-btn" onclick="toggleMenu()">⋮</button>
      <div class="tg-header-title">AJ Chat</div>
      <button class="icon-btn" onclick="openSearch()">⌕</button>

      <div id="menu" class="tg-menu hidden">
        <button onclick="openProfile()">👤 الملف الشخصي</button>
        <button class="danger" onclick="logout()">↪ تسجيل الخروج</button>
      </div>
    </header>

    <!-- قائمة القنوات والمحادثات -->
    <div id="homeView" class="chat-list">
      <div id="chatList"></div>
    </div>

    <!-- واجهة البحث -->
    <div id="searchView" class="hidden" style="flex:1;">
      <div style="padding:12px; background:var(--tg-surface);">
        <input id="searchInput" class="tg-input" placeholder="ابحث باسم المستخدم..." oninput="searchUsers()">
      </div>
      <div id="searchResults" class="chat-list"></div>
    </div>

    <!-- واجهة البروفايل مثل تليجرام -->
    <div id="profileView" class="profile-view hidden">
      <div class="profile-banner">
        <button class="icon-btn" style="position:absolute; right:12px; top:12px;" onclick="goHome()">‹</button>
        
        <div class="profile-avatar-container">
          <div id="pAvatarText" class="profile-avatar-main">؟</div>
          <img id="pAvatarImg" class="profile-avatar-main hidden" src="" alt="Avatar">
          <label for="avatarInput" class="profile-upload-btn">📷</label>
          <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
        </div>

        <h2 id="pHeaderName">اسم المستخدم</h2>
        <div id="pHeaderUser" style="font-size:14px; color:var(--tg-text-muted);">@username</div>
      </div>

      <div class="profile-section-title">إعدادات الحساب</div>
      <div class="profile-card">
        <div class="profile-field-item">
          <div class="tg-input-group">
            <label>اسم العرض</label>
            <input id="pNameInput" class="tg-input">
          </div>
        </div>
        <div class="profile-field-item">
          <div class="tg-input-group">
            <label>اسم المستخدم</label>
            <input id="pUsernameInput" class="tg-input">
          </div>
        </div>
        <div class="profile-field-item">
          <div class="tg-input-group">
            <label>البريد الإلكتروني</label>
            <input id="pEmailInput" class="tg-input" readonly style="opacity:0.6;">
          </div>
        </div>
        <button class="tg-btn" style="margin:16px 0;" onclick="saveProfile()">حفظ التغييرات</button>
      </div>
    </div>

    <!-- غرفة المحادثات -->
    <div id="chatView" class="chat-room hidden">
      <header class="tg-header">
        <button class="icon-btn" onclick="goHome()">‹</button>
        <div style="flex:1; text-align:right; margin-right:12px;">
          <div id="chatTitle" style="font-weight:700; font-size:16px;">المحادثة</div>
          <div id="chatSub" style="font-size:12px; color:var(--tg-text-muted);"></div>
        </div>
      </header>

      <div id="messagesArea" class="messages-area"></div>

      <form class="chat-input-bar" onsubmit="sendMessage(event)">
        <input id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
        <button class="icon-btn" style="color:var(--tg-primary)" type="submit">➤</button>
      </form>
    </div>
  </section>

</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
