<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#527da3">
<title>AJ Chat</title>

<!-- استيراد مكتبات Firebase عبر CDN -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --primary: #527da3;
  --primary-dark: #416887;
  --bg: #f1f3f5;
  --card: #ffffff;
  --text: #202b36;
  --muted: #7b8793;
  --border: #e5e9ed;
  --bubble: #e1ffc7;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Tahoma, sans-serif; background: var(--bg); color: var(--text); }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

.app {
  max-width: 600px;
  min-height: 100dvh;
  margin: auto;
  background: var(--card);
  position: relative;
  overflow: hidden;
}

.topbar {
  background: var(--primary);
  color: white;
  padding: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 68px;
  position: sticky;
  top: 0;
  z-index: 5;
}

.brand { font-size: 22px; font-weight: bold; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { border: none; background: transparent; color: white; font-size: 25px; padding: 5px 8px; border-radius: 8px; }
.icon-btn:active { background: #ffffff25; }

.search-wrap { padding: 12px; background: white; border-bottom: 1px solid var(--border); }
.search-input { width: 100%; border: none; outline: none; border-radius: 25px; padding: 13px 16px; background: #f0f2f5; color: var(--text); }

.page { min-height: calc(100dvh - 68px); background: white; }
.empty-state { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; }
.empty-icon { width: 100px; height: 100px; background: #e7f1f8; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 43px; margin: 0 auto 20px; }

.primary-btn { border: none; background: var(--primary); color: white; padding: 13px 20px; border-radius: 12px; font-weight: bold; margin-top: 10px; width: 100%; }
.secondary-btn { border: 1px solid var(--border); background: white; color: var(--text); padding: 12px 16px; border-radius: 10px; width: 100%; margin-top: 10px; }

.fab {
  position: fixed;
  bottom: 24px;
  left: max(calc((100vw - 560px) / 2 + 20px), 20px);
  width: 58px; height: 58px;
  border: none; border-radius: 50%;
  background: var(--primary); color: white;
  font-size: 28px; box-shadow: 0 5px 15px #0002; z-index: 4;
}

.menu {
  position: absolute; top: 58px; left: 12px; width: 220px;
  background: white; color: var(--text); box-shadow: 0 8px 30px #0003;
  border-radius: 12px; z-index: 20; overflow: hidden;
}
.menu button { display: block; width: 100%; border: none; background: white; text-align: right; padding: 15px 17px; color: var(--text); border-bottom: 1px solid #f1f1f1; }
.menu button:last-child { color: #d34a4a; border-bottom: none; }

.section { padding: 20px; }
.back-row { display: flex; align-items: center; gap: 14px; padding: 17px; border-bottom: 1px solid var(--border); font-size: 19px; font-weight: bold; }
.back-btn { border: none; background: transparent; color: var(--primary); font-size: 25px; padding: 0 5px; }

.profile-head { text-align: center; padding: 25px 10px; background: #f5f8fa; border-radius: 16px; margin-bottom: 22px; }
.avatar { width: 90px; height: 90px; margin: 0 auto 13px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: bold; }
.muted { color: var(--muted); font-size: 14px; }

.field { margin: 17px 0; }
.field label { display: block; margin-bottom: 9px; font-weight: bold; font-size: 14px; }
.field input { width: 100%; border: 1px solid #dce2e7; background: white; border-radius: 10px; padding: 14px; outline: none; }
.field input:focus { border-color: var(--primary); }

.result-row, .chat-row { width: 100%; border: none; border-bottom: 1px solid var(--border); background: white; display: flex; gap: 13px; align-items: center; padding: 14px; text-align: right; }
.small-avatar { width: 50px; height: 50px; flex-shrink: 0; border-radius: 50%; background: #dcebf5; color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; }
.row-info { min-width: 0; flex: 1; }
.row-info strong { display: block; margin-bottom: 6px; }
.row-info small { color: var(--muted); }

.chat-messages { height: calc(100dvh - 140px); background: #e9eff2; overflow-y: auto; padding: 18px 12px; display: flex; flex-direction: column; gap: 10px; }
.message { max-width: 82%; padding: 11px 13px; background: white; border-radius: 13px 13px 13px 3px; align-self: flex-start; line-height: 1.6; }
.message.mine { align-self: flex-end; background: var(--bubble); border-radius: 13px 13px 3px 13px; }
.message time { display: block; color: #758579; font-size: 10px; margin-top: 4px; text-align: left; }

.chat-compose { position: sticky; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 10px; background: white; border-top: 1px solid var(--border); }
.chat-compose input { flex: 1; border: 1px solid var(--border); border-radius: 25px; padding: 12px 15px; outline: none; }
.send-btn { width: 45px; height: 45px; border: none; border-radius: 50%; color: white; background: var(--primary); font-size: 20px; }

.login-wrap { padding: 35px 22px; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; }
.login-logo { text-align: center; margin-bottom: 30px; }
.login-logo .logo-circle { width: 95px; height: 95px; border-radius: 50%; background: var(--primary); color: white; font-size: 39px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }

.toast { position: fixed; z-index: 100; bottom: 25px; left: 50%; transform: translateX(-50%); background: #263238; color: white; padding: 13px 18px; border-radius: 12px; text-align: center; box-shadow: 0 5px 20px #0002; max-width: 90%; }
</style>
</head>

<body>

<div class="app">
  <!-- تسجيل الدخول / إنشاء حساب -->
  <section id="loginPage" class="login-wrap">
    <div class="login-logo">
      <div class="logo-circle">AJ</div>
      <h1>AJ Chat</h1>
      <p>تطبيق محادثات سحابي متطور</p>
    </div>

    <div>
      <div class="field">
        <label for="emailInput">البريد الإلكتروني</label>
        <input id="emailInput" type="email" placeholder="example@gmail.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="passwordInput">كلمة المرور</label>
        <input id="passwordInput" type="password" placeholder="أدخل كلمة المرور (6 أحرف على الأقل)">
      </div>
      
      <button class="primary-btn" onclick="handleAuth(false)">تسجيل الدخول</button>
      <button class="secondary-btn" onclick="handleAuth(true)">إنشاء حساب جديد</button>
    </div>
  </section>

  <!-- واجهة التطبيق الرئيسية -->
  <section id="mainPage" class="hidden">
    <header class="topbar">
      <div class="brand">AJ Chat</div>
      <div class="top-actions">
        <button class="icon-btn" onclick="openSearch()">⌕</button>
        <button class="icon-btn" onclick="toggleMenu()">⋮</button>
      </div>
      <div id="menu" class="menu hidden">
        <button onclick="openProfile()">👤 الملف الشخصي</button>
        <button onclick="logout()">↪ تسجيل الخروج</button>
      </div>
    </header>

    <div id="homePage" class="page">
      <div class="empty-state" id="emptyState">
        <div>
          <div class="empty-icon">✉</div>
          <h2>لا توجد محادثات</h2>
          <p>ابحث عن مستخدم باسمه وابدأ محادثتك الأولى الآن.</p>
          <button class="primary-btn" onclick="openSearch()" style="width:auto">بحث عن مستخدم</button>
        </div>
      </div>
      <div id="chatList"></div>
      <button class="fab" onclick="openSearch()">✎</button>
    </div>

    <!-- البحث -->
    <div id="searchPage" class="hidden page">
      <div class="back-row">
        <button class="back-btn" onclick="goHome()">‹</button>
        <span>بحث عن مستخدم</span>
      </div>
      <div class="search-wrap">
        <input id="usernameSearch" class="search-input" placeholder="ابحث باسم المستخدم (مثال: ahmed)..." oninput="searchUsers()">
      </div>
      <div id="searchResults"></div>
    </div>

    <!-- الملف الشخصي -->
    <div id="profilePage" class="hidden page">
      <div class="back-row">
        <button class="back-btn" onclick="goHome()">‹</button>
        <span>الملف الشخصي</span>
      </div>
      <div class="section">
        <div class="profile-head">
          <div class="avatar" id="profileAvatar">م</div>
          <h2 id="profileDisplayPreview">مستخدم جديد</h2>
          <div class="muted" id="profileUsernamePreview">بدون اسم مستخدم</div>
        </div>
        <div class="field">
          <label>اسم العرض</label>
          <input id="displayNameInput" maxlength="40" placeholder="اسمك الظاهر">
        </div>
        <div class="field">
          <label>اسم المستخدم (لتسهيل بحث الآخرين)</label>
          <input id="profileUsernameInput" maxlength="24" placeholder="username">
        </div>
        <button class="primary-btn" onclick="saveProfile()">حفظ التغييرات</button>
      </div>
    </div>

    <!-- المحادثة الفردية -->
    <div id="chatPage" class="hidden page">
      <header class="topbar">
        <button class="icon-btn" onclick="goHome()">‹</button>
        <div style="flex:1; margin-right:10px;">
          <div id="chatTitle" style="font-weight:bold;">المحادثة</div>
          <div id="chatHandle" style="font-size:12px; color:#e1eaf0;"></div>
        </div>
      </header>
      <div id="chatMessages" class="chat-messages"></div>
      <form class="chat-compose" onsubmit="sendMessage(event)">
        <input id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
        <button class="send-btn" type="submit">➤</button>
      </form>
    </div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>

<script>
// إعدادات Firebase الخاصة بمشروعك
const firebaseConfig = {
  apiKey: "AIzaSyDxQZCL4OawmPLKLRdQdbrQOHN7vl3p5EQ",
  authDomain: "aj-chat-df534.firebaseapp.com",
  projectId: "aj-chat-df534",
  storageBucket: "aj-chat-df534.firebasestorage.app",
  messagingSenderId: "1022301130899",
  appId: "1:1022301130899:web:171184929244a979b6bd66",
  measurementId: "G-0BHD040LHT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let activeChatId = null;

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 3000);
}

// التحقق التلقائي إذا كان المستخدم مسجلاً قبلاً
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    enterApp();
  }
});

function handleAuth(isSignUp) {
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value.trim();

  if(!email || !password) {
    showToast("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
    return;
  }

  if (isSignUp) {
    // إنشاء حساب جديد
    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        currentUser = userCredential.user;
        checkUserDoc(currentUser.uid, currentUser.email);
      })
      .catch((error) => {
        showToast("خطأ: " + error.message);
      });
  } else {
    // تسجيل الدخول
    auth.signInWithEmailAndPassword(email, password)
      .then((userCredential) => {
        currentUser = userCredential.user;
        enterApp();
      })
      .catch((error) => {
        showToast("خطأ في بيانات الدخول!");
      });
  }
}

function checkUserDoc(uid, email) {
  db.collection("users").doc(uid).get().then(doc => {
    if(!doc.exists) {
      db.collection("users").doc(uid).set({
        id: uid,
        email: email,
        displayName: email.split('@')[0],
        username: email.split('@')[0],
        createdAt: Date.now()
      }).then(() => enterApp());
    } else {
      enterApp();
    }
  });
}

function enterApp() {
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("mainPage").classList.remove("hidden");
  goHome();
}

function logout() {
  auth.signOut().then(() => {
    location.reload();
  });
}

function toggleMenu() {
  document.getElementById("menu").classList.toggle("hidden");
}

function showSubPage(pageId) {
  ["homePage", "searchPage", "profilePage", "chatPage"].forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(pageId).classList.remove("hidden");
  document.getElementById("menu").classList.add("hidden");
}

function goHome() {
  showSubPage("homePage");
  loadChats();
}

function openSearch() { showSubPage("searchPage"); }
function openProfile() {
  showSubPage("profilePage");
  db.collection("users").doc(currentUser.uid).get().then(doc => {
    const data = doc.data();
    document.getElementById("displayNameInput").value = data.displayName || "";
    document.getElementById("profileUsernameInput").value = data.username || "";
    document.getElementById("profileDisplayPreview").textContent = data.displayName || "مستخدم جديد";
    document.getElementById("profileUsernamePreview").textContent = data.username ? "@" + data.username : "بدون اسم مستخدم";
  });
}

function saveProfile() {
  const name = document.getElementById("displayNameInput").value.trim();
  const username = document.getElementById("profileUsernameInput").value.trim().toLowerCase();

  db.collection("users").doc(currentUser.uid).update({
    displayName: name,
    username: username
  }).then(() => {
    showToast("تم حفظ الملف الشخصي بنجاح!");
    goHome();
  });
}

function searchUsers() {
  const query = document.getElementById("usernameSearch").value.trim().toLowerCase();
  const container = document.getElementById("searchResults");
  container.innerHTML = "";
  if(query.length < 2) return;

  db.collection("users").where("username", ">=", query).where("username", "<=", query + "\uf8ff")
    .get().then((snapshot) => {
      snapshot.forEach(doc => {
        const user = doc.data();
        if(user.id === currentUser.uid) return;

        const btn = document.createElement("button");
        btn.className = "result-row";
        btn.innerHTML = `<div class="small-avatar">${(user.displayName||"?").charAt(0)}</div>
                         <div class="row-info"><strong>${user.displayName}</strong><small>@${user.username}</small></div>`;
        btn.onclick = () => startChat(user);
        container.appendChild(btn);
      });
    });
}

function startChat(user) {
  const chatId = [currentUser.uid, user.id].sort().join("__");
  activeChatId = chatId;

  db.collection("chats").doc(chatId).get().then(doc => {
    if(!doc.exists) {
      db.collection("chats").doc(chatId).set({
        participants: [currentUser.uid, user.id],
        otherUser: { id: user.id, displayName: user.displayName, username: user.username },
        updatedAt: Date.now()
      });
    }
    openChatRoom(user.displayName, user.username);
  });
}

function openChatRoom(name, username) {
  document.getElementById("chatTitle").textContent = name;
  document.getElementById("chatHandle").textContent = "@" + username;
  showSubPage("chatPage");
  
  db.collection("chats").doc(activeChatId).collection("messages")
    .orderBy("createdAt", "asc")
    .onSnapshot(snapshot => {
      const box = document.getElementById("chatMessages");
      box.innerHTML = "";
      snapshot.forEach(doc => {
        const msg = doc.data();
        const div = document.createElement("div");
        div.className = "message" + (msg.senderId === currentUser.uid ? " mine" : "");
        div.innerHTML = `<div>${msg.text}</div><time>${new Date(msg.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</time>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    });
}

function sendMessage(e) {
  e.preventDefault();
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if(!text || !activeChatId) return;

  db.collection("chats").doc(activeChatId).collection("messages").add({
    senderId: currentUser.uid,
    text: text,
    createdAt: Date.now()
  });

  db.collection("chats").doc(activeChatId).update({ updatedAt: Date.now() });
  input.value = "";
}

function loadChats() {
  const container = document.getElementById("chatList");
  const empty = document.getElementById("emptyState");
  
  db.collection("chats").where("participants", "array-contains", currentUser.uid)
    .onSnapshot(snapshot => {
      container.innerHTML = "";
      empty.classList.toggle("hidden", !snapshot.empty);

      snapshot.forEach(doc => {
        const chat = doc.data();
        const other = chat.otherUser || {};
        const btn = document.createElement("button");
        btn.className = "chat-row";
        btn.innerHTML = `<div class="small-avatar">${(other.displayName||"?").charAt(0)}</div>
                         <div class="row-info"><strong>${other.displayName || "محادثة"}</strong><small>@${other.username || ""}</small></div>`;
        btn.onclick = () => {
          activeChatId = doc.id;
          openChatRoom(other.displayName, other.username);
        };
        container.appendChild(btn);
      });
    });
}
</script>

</body>
</html>
