<!DOCTYPE html>

<meta charset="UTF-8">
<style id="babylon-splash">
.splash-page{position:absolute;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(circle at center,#1e293b 0%,#090d16 100%);transition:opacity .35s ease,visibility .35s ease}
.app-container[data-app-theme="light"] .splash-page{background:radial-gradient(circle at center,#ffffff 0%,#edf2f8 100%)}
.splash-page.leaving{opacity:0;visibility:hidden;pointer-events:none}
.splash-page.gone{display:none!important}
.splash-logo{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ffffff;
  background:linear-gradient(135deg,#d4af37,#b38f27);border:2px solid #fff5c0;box-shadow:0 10px 28px rgba(212,175,55,.32);animation:splashBreath 2.2s ease-in-out infinite}
.splash-logo svg{width:46px;height:46px;display:block}
.splash-title{margin-top:20px;font-size:25px;font-weight:800;letter-spacing:-.3px;color:#d4af37}
.app-container[data-app-theme="light"] .splash-title{color:#8b680e}
.splash-dots{display:flex;gap:8px;margin-top:26px}
.splash-dots i{width:8px;height:8px;border-radius:50%;background:#d4af37;opacity:.35;animation:splashDot 1.1s ease-in-out infinite}
.splash-dots i:nth-child(2){animation-delay:.18s}.splash-dots i:nth-child(3){animation-delay:.36s}
@keyframes splashDot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
@keyframes splashBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){.splash-logo,.splash-dots i{animation:none}}
</style>
