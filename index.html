<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Babylon Chat - تليجرام البابلي</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --babylon-gold: #d4af37;
  --babylon-gold-hover: #c5a028;
  --babylon-blue: #1b2a4a;
  --babylon-dark: #0f172a;
  --babylon-surface: #17212b;
  --babylon-surface-hover: #232e3c;
  --babylon-border: #232e3c;
  --text-main: #f8fafc;
  --text-muted: #8696a7;
  --error-color: #f87171;
  
  --bubble-mine: #2b5278;
  --bubble-other: #182533;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-touch-callout: none;
}

body {
  background-color: #090d16;
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100dvh;
}

.hidden { display: none !important; }

.app-container {
  width: 100%;
  max-width: 480px;
  height: 100dvh;
  background: var(--babylon-dark);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(0,0,0,0.8);
}

.auth-page {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 24px;
  background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
  text-align: center;
  overflow-y: auto;
}

.babylon-logo {
  width: 90px;
  height: 90px;
  background: linear-gradient(135deg, var(--babylon-gold), #b38f27);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  color: var(--babylon-dark);
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
  border: 2px solid #fff5c0;
}

.auth-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--babylon-gold); }
.auth-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }

.babylon-tabs {
  display: flex;
  width: 100%;
  background: var(--babylon-dark);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 20px;
  border: 1px solid var(--babylon-border);
}

.babylon-tab {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-weight: 600;
  border-radius: 9px;
  cursor: pointer;
}

.babylon-tab.active {
  background: var(--babylon-gold);
  color: var(--babylon-dark);
}

.input-group {
  width: 100%;
  text-align: right;
  margin-bottom: 14px;
}

.input-group label {
  display: block;
  font-size: 12px;
  color: var(--babylon-gold);
  margin-bottom: 5px;
  font-weight: 600;
}

.babylon-input {
  width: 100%;
  padding: 12px 14px;
  background: var(--babylon-dark);
  border: 1px solid var(--babylon-border);
  border-radius: 10px;
  color: white;
  outline: none;
  font-size: 14px;
}

.field-error {
  color: var(--error-color);
  font-size: 12px;
  margin-top: 5px;
  text-align: right;
  display: block;
}

.babylon-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--babylon-gold), #b38f27);
  color: var(--babylon-dark);
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

.main-header {
  height: 56px;
  background: var(--babylon-surface);
  border-bottom: 1px solid rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 10;
}
.main-header-title { font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: 0.3px; }

.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  cursor: pointer;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover { background: var(--babylon-surface-hover); color: white; }

.telegram-bottom-nav {
  height: 60px;
  background: var(--babylon-surface);
  border-top: 1px solid rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 10;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
  gap: 3px;
  padding: 6px 0;
}
.nav-item span.nav-icon { font-size: 20px; }
.nav-item.active { color: #64b5f6; }

.chat-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  background-color: #0e1621;
}

.empty-chats {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  color: var(--text-muted);
}
.empty-chats-icon {
  width: 80px;
  height: 80px;
  background: var(--babylon-surface);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  margin-bottom: 16px;
  border: 1px solid var(--babylon-border);
  color: var(--babylon-gold);
}

.chat-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  gap: 14px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.02);
}
.chat-item:hover { background: var(--babylon-surface-hover); }

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--babylon-gold), var(--babylon-blue));
  color: var(--babylon-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 20px;
  object-fit: cover;
  flex-shrink: 0;
}

.chat-item-info { flex: 1; min-width: 0; text-align: right; }
.chat-item-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: white; }
.chat-item-sub { font-size: 13.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.profile-view {
  flex: 1;
  overflow-y: auto;
  background: var(--babylon-dark);
}
.babylon-profile-header {
  background: var(--babylon-surface);
  padding: 24px 16px;
  text-align: center;
  border-bottom: 1px solid var(--babylon-border);
  position: relative;
}
.profile-avatar-box {
  position: relative;
  width: 90px;
  height: 90px;
  margin: 0 auto 12px;
}
.profile-avatar-img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: var(--babylon-gold);
  font-size: 34px;
  color: var(--babylon-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  object-fit: cover;
  border: 2px solid var(--babylon-gold);
}
.camera-badge {
  position: absolute;
  bottom: 0;
  left: 0;
  background: var(--babylon-gold);
  color: var(--babylon-dark);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 2px solid var(--babylon-surface);
  font-size: 13px;
}
.profile-section-label {
  padding: 16px 16px 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--babylon-gold);
  text-align: right;
}
.profile-settings-card {
  background: var(--babylon-surface);
  border-top: 1px solid var(--babylon-border);
  border-bottom: 1px solid var(--babylon-border);
  padding: 0 16px;
}
.profile-row {
  padding: 12px 0;
  border-bottom: 1px solid var(--babylon-border);
  text-align: right;
}
.profile-row:last-child { border: none; }

.telegram-chat-header {
  height: 60px;
  background: #17212b;
  border-bottom: 1px solid rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  padding: 0 8px;
  z-index: 10;
  gap: 8px;
}

.telegram-user-info {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  min-width: 0;
}

.telegram-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--babylon-gold);
  color: var(--babylon-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 17px;
  flex-shrink: 0;
  object-fit: cover;
}

.telegram-user-details {
  display: flex;
  flex-direction: column;
  text-align: right;
  min-width: 0;
}

.telegram-user-name {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.telegram-user-status {
  font-size: 12px;
  color: var(--text-muted);
}

.chat-room {
  flex: 1;
  display: flex;
  flex-direction: column;
  background-color: #0e1621;
  position: relative;
  overflow: hidden;
}

.chat-bg-pattern {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: radial-gradient(#ffffff 1px, transparent 1px);
  background-size: 24px 24px;
}

.messages-area {
  flex: 1;
  padding: 12px 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  z-index: 1;
}

.msg-bubble {
  width: fit-content;
  max-width: 82%;
  padding: 6px 10px 6px 10px;
  font-size: 14.5px;
  line-height: 1.4;
  background: var(--bubble-other);
  align-self: flex-start;
  color: #ffffff;
  border-radius: 12px 12px 12px 4px;
  position: relative;
  cursor: pointer;
  word-break: break-word;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
}

.msg-bubble.mine {
  align-self: flex-end;
  background: var(--bubble-mine);
  border-radius: 12px 12px 4px 12px;
}

.msg-text { padding-left: 45px; }

.reply-quote {
  background: rgba(0, 0, 0, 0.25);
  border-right: 3px solid var(--babylon-gold);
  padding: 3px 8px;
  margin-bottom: 4px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--babylon-gold);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

.msg-meta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10.5px;
  color: rgba(255, 255, 255, 0.6);
  position: absolute;
  bottom: 4px;
  left: 8px;
  user-select: none;
}

.check-mark {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.6);
}
.check-mark.read {
  color: #4ade80;
  font-weight: bold;
}

.reactions-row {
  display: flex;
  gap: 4px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.reaction-badge {
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 11px;
}

.audio-player {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 210px;
  padding: 2px 50px 2px 0;
}
.audio-player audio {
  width: 100%;
  height: 32px;
  filter: invert(0.9) hue-rotate(180deg);
}

.chat-input-container {
  background: #17212b;
  border-top: 1px solid rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  z-index: 2;
}

.reply-preview-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px 0 14px;
  font-size: 12px;
  color: var(--babylon-gold);
}

.chat-input-bar {
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.chat-input-bar input {
  flex: 1;
  background: transparent;
  border: none;
  padding: 10px 12px;
  color: white;
  outline: none;
  font-size: 15px;
}

.recording-indicator {
  color: #f87171;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.msg-actions-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.emoji-picker-bar {
  background: var(--babylon-surface);
  border: 1px solid var(--babylon-border);
  border-radius: 30px;
  padding: 8px 14px;
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}
.emoji-btn { font-size: 22px; cursor: pointer; }

.msg-actions-card {
  width: 260px;
  background: var(--babylon-surface);
  border: 1px solid var(--babylon-border);
  border-radius: 14px;
  overflow: hidden;
}
.msg-actions-card button {
  width: 100%;
  padding: 14px;
  background: transparent;
  border: none;
  color: white;
  font-size: 14px;
  text-align: right;
  border-bottom: 1px solid var(--babylon-border);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.msg-actions-card button.danger { color: var(--error-color); }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--babylon-surface);
  color: var(--babylon-gold);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 1000;
  border: 1px solid var(--babylon-gold);
}
</style>
</head>

<body>

<div class="app-container">

  <section id="authPage" class="auth-page">
    <div class="babylon-logo">🏛</div>
    <h1 class="auth-title">Babylon Chat</h1>
    <p class="auth-subtitle">تواصل عبر البريد الإلكتروني بنكهة بابلية أصيلة</p>

    <div class="babylon-tabs">
      <button id="tabLogin" class="babylon-tab active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button id="tabRegister" class="babylon-tab" onclick="switchTab('register')">إنشاء حساب</button>
    </div>

    <div id="formLogin" style="width:100%;">
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input id="loginEmail" class="babylon-input" type="email" placeholder="name@domain.com">
        <span id="loginEmailError" class="field-error hidden"></span>
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input id="loginPassword" class="babylon-input" type="password" placeholder="••••••••">
        <span id="loginPassError" class="field-error hidden"></span>
      </div>
      <button class="babylon-btn" onclick="loginUser()">دخول</button>
    </div>

    <div id="formRegister" class="hidden" style="width:100%;">
      <div class="input-group">
        <label>اسم العرض (الاسم الشخصي)</label>
        <input id="regName" class="babylon-input" type="text" placeholder="اسمك الكريم">
      </div>
      <div class="input-group">
        <label>اسم المستخدم (5 أحرف على الأقل - Username)</label>
        <input id="regUsername" class="babylon-input" type="text" placeholder="babylon_user">
        <span id="regUserError" class="field-error hidden"></span>
      </div>
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input id="regEmail" class="babylon-input" type="email" placeholder="name@domain.com">
        <span id="regEmailError" class="field-error hidden"></span>
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input id="regPassword" class="babylon-input" type="password" placeholder="6 أحرف على الأقل">
        <span id="regPassError" class="field-error hidden"></span>
      </div>
      <button class="babylon-btn" onclick="registerUser()">تسجيل حساب جديد</button>
    </div>
  </section>

  <section id="mainPage" class="hidden" style="height:100%; display:flex; flex-direction:column;">
    
    <header id="mainHeader" class="main-header">
      <div class="main-header-title">Telegram</div>
      <button class="icon-btn" onclick="openSearch()" title="بحث عن مستخدم باليوزر">🔍</button>
    </header>

    <div id="homeView" class="chat-list" style="flex:1; overflow-y:auto;">
      <div id="chatList" style="display:flex; flex-direction:column;"></div>
    </div>

    <div id="searchView" class="hidden" style="flex:1; display:flex; flex-direction:column; background:#0e1621;">
      <div style="padding:12px; background:var(--babylon-surface); border-bottom:1px solid var(--babylon-border); display:flex; align-items:center; gap:10px;">
        <button class="icon-btn" onclick="goHome()" title="الرجوع">‹</button>
        <input id="searchInput" class="babylon-input" placeholder="ابحث باسم المستخدم (5 أحرف فأكثر)..." oninput="searchUsers()">
      </div>
      <div id="searchResults" class="chat-list"></div>
    </div>

    <!-- شاشة الإعدادات والبروفايل المعدلة للتحديث التلقائي -->
    <div id="profileView" class="profile-view hidden">
      <div class="babylon-profile-header">
        <button class="icon-btn" style="position:absolute; right:12px; top:12px;" onclick="goHome()">‹</button>
        
        <div class="profile-avatar-box">
          <div id="pAvatarText" class="profile-avatar-img">🏛</div>
          <img id="pAvatarImg" class="profile-avatar-img hidden" src="" alt="Avatar">
          <label for="avatarInput" class="camera-badge">📷</label>
          <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="uploadAvatarLive(event)">
        </div>

        <h2 id="pHeaderName" style="font-size:18px; font-weight:600; color:var(--babylon-gold);">الاسم</h2>
        <div id="pHeaderUser" style="font-size:13px; color:var(--text-muted); margin-top:2px;">@username</div>
      </div>

      <div class="profile-section-label">معلومات الحساب</div>
      <div class="profile-settings-card">
        <div class="profile-row">
          <div style="font-size:11px; color:var(--babylon-gold); margin-bottom:3px;">البريد الإلكتروني الأساسي</div>
          <div id="pEmailDisplay" style="font-size:15px; color:#e2e8f0;">email@domain.com</div>
        </div>
      </div>

      <div class="profile-section-label">تعديل الملف الشخصي (تحديث تلقائي)</div>
      <div class="profile-settings-card">
        <div class="profile-row">
          <div class="input-group" style="margin-bottom:0;">
            <label>اسم العرض</label>
            <input id="pNameInput" class="babylon-input" oninput="liveUpdateName(event)">
          </div>
        </div>
        <div class="profile-row">
          <div class="input-group" style="margin-bottom:0;">
            <label>اسم المستخدم (يوزر - 5 أحرف فأكثر)</label>
            <input id="pUsernameInput" class="babylon-input" oninput="liveUpdateUsername(event)">
            <span id="usernameLiveError" class="field-error hidden"></span>
          </div>
        </div>
      </div>

      <div style="padding:20px;">
        <button class="babylon-btn" style="background:transparent; border:1px solid var(--error-color); color:var(--error-color);" onclick="logout()">تسجيل الخروج</button>
      </div>
    </div>

    <div id="chatView" class="chat-room hidden">
      <div class="chat-bg-pattern"></div>

      <header class="telegram-chat-header">
        <button class="icon-btn" onclick="goHome()">‹</button>
        
        <div class="telegram-user-info">
          <div id="chatAvatar" class="telegram-avatar">؟</div>
          <div class="telegram-user-details">
            <div id="chatTitle" class="telegram-user-name">المحادثة</div>
            <div id="chatSub" class="telegram-user-status">غير متصل</div>
          </div>
        </div>
      </header>

      <div id="messagesArea" class="messages-area"></div>

      <div class="chat-input-container">
        <div id="replyPreviewBar" class="reply-preview-bar hidden">
          <div id="replyPreviewText">الرد على: ...</div>
          <button class="icon-btn" style="width:24px;height:24px;font-size:14px;" onclick="cancelReply()">✕</button>
        </div>
        
        <div id="recordingBar" class="chat-input-bar hidden">
          <div class="recording-indicator">🔴 جاري تسجيل بصمة صوتية... <span id="recordTimer">00:00</span></div>
          <button class="icon-btn" style="color:var(--error-color)" onclick="cancelRecording()">✕</button>
          <button class="icon-btn" style="color:var(--babylon-gold)" onclick="stopAndSendRecording()">➤</button>
        </div>

        <form id="textInputBar" class="chat-input-bar" onsubmit="sendMessage(event)">
          <input id="messageInput" placeholder="اكتب رسالتك..." autocomplete="off">
          <button type="button" class="icon-btn" style="color:var(--text-muted)" onclick="startRecording()">🎙</button>
          <button class="icon-btn" style="color:var(--babylon-gold)" type="submit">➤</button>
        </form>
      </div>
    </div>

    <!-- شريط التنقل السفلي المحدّث (المحادثات، الملف الشخصي، الإعدادات) -->
    <nav id="bottomNav" class="telegram-bottom-nav">
      <button id="navChats" class="nav-item active" onclick="goHome()">
        <span class="nav-icon">💬</span>
        <span>المحادثات</span>
      </button>
      <button id="navProfile" class="nav-item" onclick="openProfile()">
        <span class="nav-icon">👤</span>
        <span>الملف الشخصي</span>
      </button>
      <button id="navSettings" class="nav-item" onclick="openProfile()">
        <span class="nav-icon">⚙️</span>
        <span>الإعدادات</span>
      </button>
    </nav>
  </section>

</div>

<div id="msgModal" class="msg-actions-modal hidden" onclick="closeMsgModal(event)">
  <div class="emoji-picker-bar">
    <span class="emoji-btn" onclick="addReaction('👍')">👍</span>
    <span class="emoji-btn" onclick="addReaction('❤️')">❤️</span>
    <span class="emoji-btn" onclick="addReaction('😂')">😂</span>
    <span class="emoji-btn" onclick="addReaction('😮')">😮</span>
    <span class="emoji-btn" onclick="addReaction('🔥')">🔥</span>
    <span class="emoji-btn" onclick="addReaction('👏')">👏</span>
  </div>
  <div class="msg-actions-card">
    <button onclick="actionCopy()">📋 نسخ النص</button>
    <button id="btnEditMsg" class="hidden" onclick="actionEdit()">✏ تعديل الرسالة</button>
    <button id="btnDeleteMsg" class="danger hidden" onclick="actionDelete()">🗑 حذف الرسالة</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDxQZCL4OawmPLKLRdQdbrQOHN7vl3p5EQ",
  authDomain: "aj-chat-df534.firebaseapp.com",
  projectId: "aj-chat-df534",
  storageBucket: "aj-chat-df534.firebasestorage.app",
  messagingSenderId: "1022301130899",
  appId: "1:1022301130899:web:171184929244a979b6bd66"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentUserData = null;
let activeChatId = null;
let messagesUnsubscribe = null;
let userUnsubscribe = null;
let chatsListUnsubscribe = null;
let heartbeatInterval = null;
let isAppInitialized = false;

let selectedMsgId = null;
let selectedMsgText = null;
let selectedMsgSender = null;
let selectedMsgReactions = {};
let replyingToText = null;
let editingMsgId = null;

let mediaRecorder = null;
let audioChunks = [];
let recordInterval = null;
let recordSeconds = 0;
let updateTimer = null;

function clearErrors() {
  document.querySelectorAll('.field-error').forEach(el => {
    el.textContent = "";
    el.classList.add('hidden');
  });
}

function showFieldError(elementId, msg) {
  const el = document.getElementById(elementId);
  if (el) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 3000);
}

function switchTab(type) {
  clearErrors();
  if (type === 'login') {
    document.getElementById("tabLogin").classList.add("active");
    document.getElementById("tabRegister").classList.remove("active");
    document.getElementById("formLogin").classList.remove("hidden");
    document.getElementById("formRegister").classList.add("hidden");
  } else {
    document.getElementById("tabRegister").classList.add("active");
    document.getElementById("tabLogin").classList.remove("active");
    document.getElementById("formRegister").classList.remove("hidden");
    document.getElementById("formLogin").classList.add("hidden");
  }
}

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    db.collection("users").doc(user.uid).set({ online: true, lastSeen: Date.now() }, { merge: true });
    
    clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(() => {
      db.collection("users").doc(user.uid).set({ online: true, lastSeen: Date.now() }, { merge: true });
    }, 10000);

    window.addEventListener('beforeunload', () => {
      db.collection("users").doc(user.uid).set({ online: false, lastSeen: Date.now() }, { merge: true });
    });

    if (!isAppInitialized) {
      isAppInitialized = true;
      loadUserDataAndEnter(user.uid);
    }
  } else {
    isAppInitialized = false;
    document.getElementById("authPage").classList.remove("hidden");
    document.getElementById("mainPage").classList.add("hidden");
  }
});

function loadUserDataAndEnter(uid) {
  db.collection("users").doc(uid).get().then(doc => {
    if (doc.exists) {
      currentUserData = doc.data();
      updateProfileUI(currentUserData);
      enterApp();
    } else {
      const defaultData = {
        id: uid,
        displayName: currentUser.email.split('@')[0],
        username: "user_" + uid.substring(0, 5),
        email: currentUser.email,
        avatarUrl: "",
        createdAt: Date.now()
      };
      db.collection("users").doc(uid).set(defaultData).then(() => {
        currentUserData = defaultData;
        updateProfileUI(currentUserData);
        enterApp();
      });
    }
  }).catch(err => {
    console.error(err);
    enterApp();
  });
}

function updateProfileUI(u) {
  if (!u) return;
  const displayName = u.displayName || currentUser.email.split('@')[0];
  const username = u.username || "user_" + currentUser.uid.substring(0, 5);
  const email = u.email || currentUser.email;

  document.getElementById("pNameInput").value = displayName;
  document.getElementById("pUsernameInput").value = username;
  document.getElementById("pEmailDisplay").textContent = email;

  document.getElementById("pHeaderName").textContent = displayName;
  document.getElementById("pHeaderUser").textContent = "@" + username;

  if (u.avatarUrl) {
    document.getElementById("pAvatarImg").src = u.avatarUrl;
    document.getElementById("pAvatarImg").classList.remove("hidden");
    document.getElementById("pAvatarText").classList.add("hidden");
  } else {
    document.getElementById("pAvatarText").textContent = displayName.charAt(0).toUpperCase();
    document.getElementById("pAvatarText").classList.remove("hidden");
    document.getElementById("pAvatarImg").classList.add("hidden");
  }
}

function loginUser() {
  clearErrors();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if (!email) return showFieldError("loginEmailError", "الرجاء أدخل البريد الإلكتروني");
  if (!password) return showFieldError("loginPassError", "الرجاء أدخل كلمة المرور");

  auth.signInWithEmailAndPassword(email, password)
    .catch(err => {
      showFieldError("loginPassError", "البريد الإلكتروني أو كلمة المرور غير صحيحة");
    });
}

function registerUser() {
  clearErrors();
  const name = document.getElementById("regName").value.trim();
  const username = document.getElementById("regUsername").value.trim().toLowerCase();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value.trim();

  if (!name) return showToast("الرجاء إدخال اسم العرض");
  if (!username || username.length < 5) return showFieldError("regUserError", "اسم المستخدم يجب ألا يقل عن 5 أحرف!");
  if (!email) return showFieldError("regEmailError", "الرجاء إدخال البريد الإلكتروني");
  if (!password || password.length < 6) return showFieldError("regPassError", "كلمة المرور يجب أن تكون 6 أحرف على الأقل");

  db.collection("users").where("username", "==", username).get().then(snap => {
    if (!snap.empty) {
      showFieldError("regUserError", "اسم المستخدم هذا مستخدم بالفعل، اختر غيره!");
      return;
    }

    auth.createUserWithEmailAndPassword(email, password)
      .then(cred => {
        const userData = {
          id: cred.user.uid,
          displayName: name,
          username: username,
          email: email,
          avatarUrl: "",
          createdAt: Date.now()
        };
        db.collection("users").doc(cred.user.uid).set(userData).then(() => {
          currentUserData = userData;
          updateProfileUI(userData);
          showToast("مرحباً بك في Babylon Chat!");
          enterApp();
        });
      });
  });
}

function enterApp() {
  document.getElementById("authPage").classList.add("hidden");
  document.getElementById("mainPage").classList.remove("hidden");
  goHome();
}

function logout() { 
  if (currentUser) {
    clearInterval(heartbeatInterval);
    db.collection("users").doc(currentUser.uid).set({ online: false, lastSeen: Date.now() }, { merge: true }).then(() => {
      auth.signOut().then(() => location.reload());
    });
  } else {
    auth.signOut().then(() => location.reload());
  }
}

function showView(viewId) {
  ["homeView", "searchView", "profileView", "chatView"].forEach(v => document.getElementById(v).classList.add("hidden"));
  document.getElementById(viewId).classList.remove("hidden");

  const mainHeader = document.getElementById("mainHeader");
  const bottomNav = document.getElementById("bottomNav");

  if (viewId === "chatView") {
    mainHeader.classList.add("hidden");
    bottomNav.classList.add("hidden");
  } else {
    mainHeader.classList.remove("hidden");
    bottomNav.classList.remove("hidden");
  }

  document.getElementById("navChats").classList.toggle("active", viewId === "homeView");
  document.getElementById("navProfile").classList.toggle("active", viewId === "profileView");
  document.getElementById("navSettings").classList.toggle("active", viewId === "profileView");
}

function goHome() {
  if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
  if (userUnsubscribe) { userUnsubscribe(); userUnsubscribe = null; }
  activeChatId = null;
  cancelReply();
  document.getElementById("searchInput").value = "";
  document.getElementById("searchResults").innerHTML = "";
  showView("homeView");
  loadChats();
}

function openSearch() { 
  showView("searchView");
  document.getElementById("searchInput").focus();
}

function openProfile() {
  if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
  if (userUnsubscribe) { userUnsubscribe(); userUnsubscribe = null; }
  activeChatId = null;
  showView("profileView");
  if (currentUserData) {
    updateProfileUI(currentUserData);
  }
}

// التحديث التلقائي الفوري للاسم بدون زر حفظ
function liveUpdateName(e) {
  const newName = e.target.value.trim();
  if (!newName || !currentUser) return;

  clearTimeout(updateTimer);
  updateTimer = setTimeout(() => {
    db.collection("users").doc(currentUser.uid).set({ displayName: newName }, { merge: true }).then(() => {
      currentUserData.displayName = newName;
      document.getElementById("pHeaderName").textContent = newName;
    });
  }, 400);
}

// التحديث التلقائي الفوري لاسم المستخدم مع فحص التوفر وطول الأحرف
function liveUpdateUsername(e) {
  const newUsername = e.target.value.trim().toLowerCase();
  clearErrors();

  if (newUsername.length < 5) {
    showFieldError("usernameLiveError", "اسم المستخدم يجب ألا يقل عن 5 أحرف!");
    return;
  }

  clearTimeout(updateTimer);
  updateTimer = setTimeout(() => {
    db.collection("users").where("username", "==", newUsername).get().then(snap => {
      let taken = false;
      snap.forEach(doc => {
        if (doc.id !== currentUser.uid) taken = true;
      });

      if (taken) {
        showFieldError("usernameLiveError", "اسم المستخدم هذا مستخدم بالفعل!");
        return;
      }

      db.collection("users").doc(currentUser.uid).set({ username: newUsername }, { merge: true }).then(() => {
        currentUserData.username = newUsername;
        document.getElementById("pHeaderUser").textContent = "@" + newUsername;
        showToast("تم تحديث اليوزر تلقائياً");
      });
    });
  }, 500);
}

// رفع وتحديث الصورة الشخصية تلقائياً
function uploadAvatarLive(e) {
  const file = e.target.files[0];
  if (!file || !currentUser) return;

  showToast("جاري معالجة ورفع الصورة...");

  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.src = evt.target.result;
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 150;
      canvas.height = 150;
      ctx.drawImage(img, 0, 0, 150, 150);

      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

      db.collection("users").doc(currentUser.uid).set({
        avatarUrl: compressedDataUrl
      }, { merge: true }).then(() => {
        currentUserData.avatarUrl = compressedDataUrl;
        updateProfileUI(currentUserData);
        showToast("تم تحديث الصورة الشخصية بنجاح!");
      });
    };
  };
  reader.readAsDataURL(file);
}

function searchUsers() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const res = document.getElementById("searchResults");
  res.innerHTML = "";
  if (q.length < 5) return;

  db.collection("users").where("username", ">=", q).where("username", "<=", q + "\uf8ff")
    .get().then(snap => {
      snap.forEach(doc => {
        const u = doc.data();
        if (u.id === currentUser.uid) return;

        const div = document.createElement("div");
        div.className = "chat-item";
        div.innerHTML = `
          <div class="avatar">${u.avatarUrl ? `<img src="${u.avatarUrl}" style="width:100%;height:100%;border-radius:50%">` : (u.displayName||"?").charAt(0).toUpperCase()}</div>
          <div class="chat-item-info">
            <div class="chat-item-name">${u.displayName}</div>
            <div class="chat-item-sub">@${u.username}</div>
          </div>`;
        div.onclick = () => startChat(u);
        res.appendChild(div);
      });
    });
}

function startChat(u) {
  const chatId = [currentUser.uid, u.id].sort().join("__");
  activeChatId = chatId;

  db.collection("chats").doc(chatId).get().then(doc => {
    if (!doc.exists) {
      db.collection("chats").doc(chatId).set({
        participants: [currentUser.uid, u.id],
        updatedAt: Date.now()
      });
    }
    openChatRoom(u.id);
  });
}

function openChatRoom(otherUserId) {
  if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
  if (userUnsubscribe) { userUnsubscribe(); userUnsubscribe = null; }
  
  showView("chatView");

  userUnsubscribe = db.collection("users").doc(otherUserId).onSnapshot(doc => {
    if (doc.exists) {
      const u = doc.data();
      document.getElementById("chatTitle").textContent = u.displayName || "مستخدم";
      const sub = document.getElementById("chatSub");
      
      const avatarBox = document.getElementById("chatAvatar");
      if (u.avatarUrl) {
        avatarBox.innerHTML = `<img src="${u.avatarUrl}" style="width:100%;height:100%;border-radius:50%">`;
      } else {
        avatarBox.textContent = (u.displayName || "?").charAt(0).toUpperCase();
      }

      if (u.online && (Date.now() - (u.lastSeen || 0) < 25000)) {
        sub.textContent = "متصل الآن";
        sub.style.color = "#4ade80";
      } else {
        sub.textContent = "آخر ظهور كان قريباً";
        sub.style.color = "var(--text-muted)";
      }
    }
  });

  db.collection("chats").doc(activeChatId).collection("messages")
    .where("senderId", "==", otherUserId)
    .where("read", "==", false)
    .get().then(snap => {
      snap.forEach(d => d.ref.update({ read: true }));
    });

  messagesUnsubscribe = db.collection("chats").doc(activeChatId).collection("messages")
    .orderBy("createdAt", "asc")
    .onSnapshot(snap => {
      const box = document.getElementById("messagesArea");
      box.innerHTML = "";
      
      snap.forEach(doc => {
        const m = doc.data();
        const isMine = m.senderId === currentUser.uid;
        
        let checkHtml = "";
        if (isMine) {
          if (m.read) {
            checkHtml = `<span class="check-mark read">✓✓</span>`;
          } else {
            checkHtml = `<span class="check-mark">✓</span>`;
          }
        }

        let rawTimeStr = new Date(m.createdAt).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
        if (rawTimeStr.startsWith('0')) {
          rawTimeStr = rawTimeStr.substring(1);
        }

        const b = document.createElement("div");
        b.className = "msg-bubble" + (isMine ? " mine" : "");
        
        let htmlContent = "";
        if (m.replyTo) {
          htmlContent += `<div class="reply-quote">${m.replyTo}</div>`;
        }

        if (m.audioUrl) {
          htmlContent += `<div class="audio-player"><audio controls src="${m.audioUrl}"></audio></div>`;
        } else {
          htmlContent += `<div class="msg-text">${m.text}</div>`;
        }

        if (m.reactions && Object.keys(m.reactions).length > 0) {
          htmlContent += `<div class="reactions-row">`;
          for (let r in m.reactions) {
            htmlContent += `<span class="reaction-badge">${r}</span>`;
          }
          htmlContent += `</div>`;
        }

        htmlContent += `<div class="msg-meta"><span>${rawTimeStr}</span> ${checkHtml}</div>`;
        b.innerHTML = htmlContent;

        let pressTimer = null;
        let touchStartX = 0;
        let touchStartY = 0;

        b.ontouchstart = (e) => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          pressTimer = setTimeout(() => {
            openMsgModal(doc.id, m.text || "بصمة صوتية", m.senderId, m.reactions || {});
          }, 450);
        };

        b.ontouchmove = (e) => {
          let moveX = e.touches[0].clientX;
          let moveY = e.touches[0].clientY;
          if (Math.abs(moveX - touchStartX) > 10 || Math.abs(moveY - touchStartY) > 10) {
            clearTimeout(pressTimer);
          }
        };

        b.ontouchend = (e) => {
          clearTimeout(pressTimer);
          let endX = e.changedTouches[0].clientX;
          if (touchStartX - endX > 50) {
            triggerSwipeReply(m.text || "بصمة صوتية");
          }
        };

        b.onmousedown = () => {
          pressTimer = setTimeout(() => {
            openMsgModal(doc.id, m.text || "بصمة صوتية", m.senderId, m.reactions || {});
          }, 450);
        };
        b.onmouseup = b.onmouseleave = () => clearTimeout(pressTimer);

        box.appendChild(b);
      });
      box.scrollTop = box.scrollHeight;
    });
}

function triggerSwipeReply(text) {
  replyingToText = text;
  document.getElementById("replyPreviewText").textContent = "الرد على: " + replyingToText;
  document.getElementById("replyPreviewBar").classList.remove("hidden");
  document.getElementById("messageInput").focus();
  showToast("تم تفعيل الرد على الرسالة");
}

function openMsgModal(msgId, text, senderId, reactions) {
  selectedMsgId = msgId;
  selectedMsgText = text;
  selectedMsgSender = senderId;
  selectedMsgReactions = reactions || {};

  const btnEdit = document.getElementById("btnEditMsg");
  const btnDelete = document.getElementById("btnDeleteMsg");

  if (senderId === currentUser.uid) {
    btnEdit.classList.remove("hidden");
    btnDelete.classList.remove("hidden");
  } else {
    btnEdit.classList.add("hidden");
    btnDelete.classList.add("hidden");
  }

  document.getElementById("msgModal").classList.remove("hidden");
}

function closeMsgModal(e) {
  if (e.target.id === "msgModal") {
    document.getElementById("msgModal").classList.add("hidden");
  }
}

function addReaction(emoji) {
  if (!activeChatId || !selectedMsgId) return;

  let newReactions = { ...selectedMsgReactions };

  if (newReactions[emoji]) {
    delete newReactions[emoji];
  } else {
    newReactions[emoji] = true;
  }

  db.collection("chats").doc(activeChatId).collection("messages").doc(selectedMsgId).update({
    reactions: newReactions
  }).then(() => {
    document.getElementById("msgModal").classList.add("hidden");
  });
}

function actionCopy() {
  navigator.clipboard.writeText(selectedMsgText);
  showToast("تم نسخ النص!");
  document.getElementById("msgModal").classList.add("hidden");
}

function cancelReply() {
  replyingToText = null;
  document.getElementById("replyPreviewBar").classList.add("hidden");
}

function actionEdit() {
  editingMsgId = selectedMsgId;
  document.getElementById("messageInput").value = selectedMsgText;
  document.getElementById("messageInput").focus();
  document.getElementById("msgModal").classList.add("hidden");
  showToast("أدخل التعديل ثم اضغط إرسال");
}

function actionDelete() {
  if (confirm("هل تريد حذف هذه الرسالة؟")) {
    db.collection("chats").doc(activeChatId).collection("messages").doc(selectedMsgId).delete()
      .then(() => showToast("تم حذف الرسالة"));
  }
  document.getElementById("msgModal").classList.add("hidden");
}

function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return showToast("المتصفح لا يدعم تسجيل الصوت");
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();

    recordSeconds = 0;
    document.getElementById("textInputBar").classList.add("hidden");
    document.getElementById("recordingBar").classList.remove("hidden");

    recordInterval = setInterval(() => {
      recordSeconds++;
      let mins = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
      let secs = String(recordSeconds % 60).padStart(2, '0');
      document.getElementById("recordTimer").textContent = `${mins}:${secs}`;
    }, 1000);
  }).catch(err => {
    showToast("يرجى إعطاء إذن المايكروفون للتسجيل");
  });
}

function cancelRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  clearInterval(recordInterval);
  document.getElementById("recordingBar").classList.add("hidden");
  document.getElementById("textInputBar").classList.remove("hidden");
}

function stopAndSendRecording() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

  mediaRecorder.onstop = () => {
    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64Audio = reader.result;

      db.collection("chats").doc(activeChatId).collection("messages").add({
        senderId: currentUser.uid,
        audioUrl: base64Audio,
        read: false,
        createdAt: Date.now()
      });

      cancelRecording();
      showToast("تم إرسال البصمة الصوتية!");
    };
    reader.readAsDataURL(audioBlob);
  };

  mediaRecorder.stop();
}

function sendMessage(e) {
  e.preventDefault();
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text || !activeChatId) return;

  if (editingMsgId) {
    db.collection("chats").doc(activeChatId).collection("messages").doc(editingMsgId).update({
      text: text
    }).then(() => {
      editingMsgId = null;
      input.value = "";
      showToast("تم تعديل الرسالة بنجاح");
    });
  } else {
    const msgData = {
      senderId: currentUser.uid,
      text: text,
      read: false,
      createdAt: Date.now()
    };

    if (replyingToText) {
      msgData.replyTo = replyingToText;
    }

    db.collection("chats").doc(activeChatId).collection("messages").add(msgData);
    
    input.value = "";
    cancelReply();
  }
}

function loadChats() {
  const container = document.getElementById("chatList");
  
  if (chatsListUnsubscribe) { chatsListUnsubscribe(); chatsListUnsubscribe = null; }
  if (!currentUser) return;

  chatsListUnsubscribe = db.collection("chats")
    .where("participants", "array-contains", currentUser.uid)
    .onSnapshot(snap => {
      if (snap.empty) {
        container.innerHTML = `
          <div class="empty-chats">
            <div class="empty-chats-icon">🏛</div>
            <div style="font-weight: 600; font-size:16px; margin-bottom: 6px; color: var(--babylon-gold);">لا توجد محادثات في بابل بعد</div>
            <div style="font-size: 13px; color: var(--text-muted);">اضغط على أيقونة البحث (🔍) في الأعلى وابحث عن مستخدم بيوزر لا يقل عن 5 أحرف</div>
          </div>`;
        return;
      }

      container.innerHTML = "";
      const processedUsers = new Set();

      snap.forEach(chatDoc => {
        const chatData = chatDoc.data();
        const participants = chatData.participants || [];
        const otherId = participants.find(id => id !== currentUser.uid);
        
        if (!otherId || processedUsers.has(otherId)) return;
        processedUsers.add(otherId);

        db.collection("users").doc(otherId).get().then(userDoc => {
          if (!userDoc.exists) return;
          const u = userDoc.data();

          const div = document.createElement("div");
          div.className = "chat-item";
          div.innerHTML = `
            <div class="avatar">${u.avatarUrl ? `<img src="${u.avatarUrl}" style="width:100%;height:100%;border-radius:50%">` : (u.displayName||"?").charAt(0).toUpperCase()}</div>
            <div class="chat-item-info">
              <div class="chat-item-name">${u.displayName || "مستخدم"}</div>
              <div class="chat-item-sub">@${u.username || ""}</div>
            </div>`;
          div.onclick = () => {
            activeChatId = chatDoc.id;
            openChatRoom(otherId);
          };
          container.appendChild(div);
        });
      });
    });
</script>
