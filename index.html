<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ Chat - Telegram Web</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="app-container">

  <!-- شاشة الدخول والتسجيل -->
  <section id="authPage" class="auth-page">
    <div class="tg-logo">✈</div>
    <h1 class="auth-title">AJ Chat</h1>
    <p class="auth-subtitle">تطبيق المحادثات السحابي</p>

    <div class="tg-tabs">
      <button id="tabLogin" class="tg-tab active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button id="tabRegister" class="tg-tab" onclick="switchTab('register')">إنشاء حساب</button>
    </div>

    <!-- نموذج الدخول -->
    <div id="formLogin" style="width:100%;">
      <div class="tg-input-group">
        <label>البريد الإلكتروني</label>
        <input id="loginEmail" class="tg-input" type="email" placeholder="example@domain.com">
      </div>
      <div class="tg-input-group">
        <label>كلمة المرور</label>
        <input id="loginPassword" class="tg-input" type="password" placeholder="••••••••">
      </div>
      <button class="tg-btn" onclick="loginUser()">تسجيل الدخول</button>
    </div>

    <!-- نموذج التسجيل -->
    <div id="formRegister" class="hidden" style="width:100%;">
      <div class="tg-input-group">
        <label>اسم العرض</label>
        <input id="regName" class="tg-input" type="text" placeholder="اسمك الكامل">
      </div>
      <div class="tg-input-group">
        <label>اسم المستخدم (يوزر)</label>
        <input id="regUsername" class="tg-input" type="text" placeholder="username">
      </div>
      <div class="tg-input-group">
        <label>البريد الإلكتروني</label>
        <input id="regEmail" class="tg-input" type="email" placeholder="example@domain.com">
      </div>
      <div class="tg-input-group">
        <label>كلمة المرور</label>
        <input id="regPassword" class="tg-input" type="password" placeholder="6 أحرف على الأقل">
      </div>
      <button class="tg-btn" onclick="registerUser()">إنشاء الحساب</button>
    </div>
  </section>

  <!-- الصفحة الرئيسية -->
  <section id="mainPage" class="hidden" style="height:100%; display:flex; flex-direction:column;">
    <header class="tg-header">
      <button class="icon-btn" onclick="toggleMenu()">☰</button>
      <div class="tg-header-title">AJ Chat</div>
      <button class="icon-btn" onclick="openSearch()">⌕</button>

      <div id="menu" class="tg-menu hidden">
        <button onclick="openProfile()">👤 الملف الشخصي</button>
        <button class="danger" onclick="logout()">↪ تسجيل الخروج</button>
      </div>
    </header>

    <!-- قائمة المحادثات -->
    <div id="homeView" class="chat-list">
      <div id="chatList" style="flex:1; display:flex; flex-direction:column;"></div>
    </div>

    <!-- واجهة البحث -->
    <div id="searchView" class="hidden" style="flex:1; display:flex; flex-direction:column;">
      <div style="padding:12px; background:var(--tg-surface); border-bottom:1px solid var(--tg-border);">
        <input id="searchInput" class="tg-input" placeholder="ابحث باسم المستخدم (مثال: ali)..." oninput="searchUsers()">
      </div>
      <div id="searchResults" class="chat-list"></div>
    </div>

    <!-- واجهة البروفايل الرسمية كإعدادات تليجرام -->
    <div id="profileView" class="profile-view hidden">
      <div class="telegram-profile-header">
        <button class="icon-btn" style="position:absolute; right:12px; top:12px;" onclick="goHome()">‹</button>
        
        <div class="profile-avatar-box">
          <div id="pAvatarText" class="profile-avatar-img">؟</div>
          <img id="pAvatarImg" class="profile-avatar-img hidden" src="" alt="Avatar">
          <label for="avatarInput" class="camera-badge">📷</label>
          <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
        </div>

        <h2 id="pHeaderName" style="font-size:18px; font-weight:600;">الاسم</h2>
        <div id="pHeaderUser" style="font-size:13px; color:var(--tg-text-muted); margin-top:2px;">@username</div>
      </div>

      <div class="profile-section-label">الحساب</div>
      <div class="profile-settings-card">
        <div class="profile-row">
          <div style="font-size:11px; color:var(--tg-text-muted); margin-bottom:3px;">البريد الإلكتروني</div>
          <div id="pEmailDisplay" style="font-size:15px; color:#aab8c2;">email@domain.com</div>
        </div>
      </div>

      <div class="profile-section-label">معلومات المستخدم</div>
      <div class="profile-settings-card">
        <div class="profile-row">
          <div class="tg-input-group" style="margin-bottom:0;">
            <label>اسم العرض</label>
            <input id="pNameInput" class="tg-input">
          </div>
        </div>
        <div class="profile-row">
          <div class="tg-input-group" style="margin-bottom:0;">
            <label>اسم المستخدم</label>
            <input id="pUsernameInput" class="tg-input">
          </div>
        </div>
      </div>

      <div style="padding:16px;">
        <button class="tg-btn" onclick="saveProfile()">حفظ التغييرات</button>
      </div>
    </div>

    <!-- غرفة المحادثة -->
    <div id="chatView" class="chat-room hidden">
      <header class="tg-header">
        <button class="icon-btn" onclick="goHome()">‹</button>
        <div style="flex:1; text-align:right; margin-right:12px;">
          <div id="chatTitle" style="font-weight:600; font-size:15px;">المحادثة</div>
          <div id="chatSub" style="font-size:11px; color:var(--tg-text-muted);"></div>
        </div>
      </header>

      <div id="messagesArea" class="messages-area"></div>

      <form class="chat-input-bar" onsubmit="sendMessage(event)">
        <input id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
        <button class="icon-btn" style="color:var(--tg-primary)" type="submit">➤</button>
      </form>
    </div>
  </section>

</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
